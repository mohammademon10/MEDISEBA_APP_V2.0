# Netlify Production Configuration for MediSeba V3
# Continuous Deployment for React 19 + TypeScript + Vite SPA

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-Page Application (SPA) Deep-Linking Fallback
# Ensures direct navigation and browser refresh on all routes resolve to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Production Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
